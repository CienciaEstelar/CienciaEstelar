name: Generate Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: Push to output branch
        run: |
          git clone --branch output https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git output_repo 2>/dev/null || git clone --branch main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git output_repo
          cd output_repo
          git checkout -b output 2>/dev/null || git checkout output
          cp ../dist/*.svg .
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add *.svg
          git diff --staged --quiet || git commit -m "chore: update snake [skip ci]"
          git push origin output
